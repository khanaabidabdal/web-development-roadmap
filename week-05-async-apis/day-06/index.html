<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Product Explorer | Fetch API</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <main class="container">
            <h1>Product Explorer</h1>
            <p>Explore products using a real API.</p>

            <form id="search-form">
                <label for="search-input">Search products</label>
                <input type="search" id="search-input" placeholder="e.g. phone">

                <button type="submit">Search</button>
            </form>
            <div class="filter-controls">
                <label for="category-filter">Category:</label>
                <select id="category-filter">
                    <option value="all">All Categories</option>
                    <option value="smartphones">Smartphones</option>
                    <option value="laptops">Laptops</option>
                    <option value="fragrances">Fragrances</option>
                    <option value="beauty">Beauty</option>
                </select>
            </div>
            <div id="sort-controls">
                <label for="sort-select">Sort products:</label>
                <select id="sort-select">
                    <option value="default">Default order</option>
                    <option value="price-asc">Price:Low to High</option>
                    <option value="price-desc">Price: High to Low</option>
                </select>
            </div>

            <p id="status-message" role="status" aria-live="polite"></p>
            <section id="product-list" aria-label="Products"></section>
            <dialog id="product-dialog">
                <div id="product-details"></div>
                <button type="button" id="close-dialog">
                    Close
                </button>
            </dialog>
        </main>
    </body>
</html>
