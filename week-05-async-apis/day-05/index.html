<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Product Explorer | Fetch API</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <main class="container">
            <h1>Product Explorer</h1>
            <p>Explore products using a real API.</p>

            <form id="search-form">
                <label for="search-input">Search products</label>
                <input type="search" id="search-input" placeholder="e.g. phone">

                <button type="submit">Search</button>
            </form>

            <p id="status-message" role="status" aria-live="polite"></p>
            <section id="product-list" aria-label="Products"></section>
        </main>
    </body>
</html>
