<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Day 04 | DOM Manipulation</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <!-- Exercise 1 -->
        <h2>Employee Form</h2>
        <form id="form">
            <label for="name">Employee Name</label>
            <input type="text" name="name" id="name" placeholder="Ahmed" aria-describedby="name-error">
            <span class="error-message" id="name-error"></span>

            <label for="dept">Department</label>
            <select name="dept" id="dept" aria-describedby="dept-error">
                 <option value="" selected disabled>Select Department</option>
                <option value="IT">IT</option>
                <option value="Finance">Finance</option>
                <option value="Sale">Sales</option>
                <option value="HR">HR</option>
            </select>
            <span class="error-message" id="dept-error"></span>

            <button type="submit" id="btn">Add Employee</button> 
           
        </form>
        <div id="container"></div>

        <!-- Exercice 2 -->
         <div id="employee-card"></div>
    </body>
</html>
