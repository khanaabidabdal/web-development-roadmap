<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Registration form with JavaScript Validations">
    <title>Form Validation with JavaScript | Day 03</title>
    <link rel="stylesheet" href="style.css">
    <!-- Using defer ensures elements are loaded before the script runs -->
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Registration Form</h1>
    
    <!-- Exercise 1 & 3: Semantic form with novalidate for custom JS errors -->
    <form id="employee-form" novalidate>
        <div>
            <label for="employee-name">Employee Name:</label>
            <input type="text" id="employee-name" name="employee-name" placeholder="Abdullah Ahmed" aria-describedby="name-error">
            <span class="error-message" id="name-error"></span>
        </div>

        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="ahmed@gmail.com" aria-describedby="email-error">
            <span class="error-message" id="email-error"></span>
        </div>

        <div>
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" min="18" max="65" step="1" placeholder="26" aria-describedby="age-error">
            <span class="error-message" id="age-error"></span>
        </div>

        <div>
            <label for="department">Department:</label>
            <select id="department" name="department" aria-describedby="department-error">
                <option value="" selected disabled>Select Department</option>
                <option value="IT">IT</option>
                <option value="Finance">Finance</option>
                <option value="Sales">Sales</option>
                <option value="HR">HR</option>
            </select>
            <span class="error-message" id="department-error"></span>
        </div>

        <div>
            <label for="salary">Basic Salary:</label>
            <input type="number" name="salary" id="salary" placeholder="5000" aria-describedby="salary-error">
            <span class="error-message" id="salary-error"></span>
        </div>

        <fieldset id="employment-type-group" aria-describedby="type-error">
            <legend>Employment Type</legend>
            <label>
                <input type="radio" name="emp-type" id="full-time" value="Full-Time"> Full Time
            </label>
            <label>
                <input type="radio" name="emp-type" id="part-time" value="Part-Time"> Part Time
            </label>
            <span class="error-message" id="type-error"></span>
        </fieldset>

        <button type="submit" id="submit">Register Employee</button>
    </form>

    <!-- Challenge: Session Counter -->
    <p id="session-counter">Total Employees Registered This Session: 0</p>

    <!-- Exercise 4: Summary Card Container -->
    <div id="summary-card" style="display: none;">
        <h2>Registered Employee Summary</h2>
        <p><strong>Name:</strong> <span id="summary-name"></span></p>
        <p><strong>Email:</strong> <span id="summary-email"></span></p>
        <p><strong>Age:</strong> <span id="summary-age"></span></p>
        <p><strong>Department:</strong> <span id="summary-department"></span></p>
        <p><strong>Salary:</strong> <span id="summary-salary"></span></p>
        <p><strong>Type:</strong> <span id="summary-type"></span></p>
    </div>
</body>
</html>
