<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport content=width=device-width,initial-scale=1.0">
        <title>Modular Product Viewer</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                max-width:1100px;
                margin:0 auto;
                padding:24px;
            }
            #product-list{
                display:grid;
                grid-template-columns: repeat(auto-fit,minmax(200px,1fr));
                gap:16px;
            }
            .product-card{
                border:1px solid #ddd;
                border-radius:8px;
                padding:16px;
            }
            .product-card img{
                width:100%;
                height:150px;
                object-fit:contain;
            }
            .error{
                color:#b91c1c;
            }
        </style>
    </head>
    <body>
        <h1>Modular Product Viewer</h1>

        <label for="category-filter">Filter by category:</label>
        <select id="category-filter">
            <option value="all">All Categories</option>
        </select>

        <p id="status-message" role="status" aria-live="polite"></p>

        <section id="product-list" aria-label="Products"></section>

        <script type="module" src="./main.js"></script>
    </body>
</html>
